<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizar</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: lightcoral;
        }

        main {
            background-color: blue;
            height: 70vh;
            margin: 50px;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-evenly;
            align-items: center;
        }

        section {
            background-color: brown;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section></section>
        <section></section>
        <section></section>
    </main>
</body>
</html>
