<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .container {
            background-color: rgb(3, 3, 45);
            display: flex;
            flex-flow: row nowrap;
            align-items: flex-start;
            height: 400px;
        }

        .item {
            background-color: aqua;
            border: solid 2px black;
            text-align: center;
            padding: 20px;
        }

        #i1 {
            align-self: stretch
        }

        #i2 {
            
        }

        #i3 {
            align-self: center;
        }

        #i4 {
            align-self: flex-end;
        }

        #i5 {
            align-self: center;
        }

        #i6 {
            
        }

        #i7 {
            align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
