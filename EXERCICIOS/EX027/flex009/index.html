<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .container {
            background-color: rgb(3, 3, 45);
            display: flex;
            flex-flow: row wrap;
        }

        .item {
            background-color: aqua;
            border: solid 2px black;
            text-align: center;
            flex-basis: 150px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">AAAAAAA</div>
        <div class="item">B</div>
        <div class="item">CCCCCCCCC CCCCCCCC CCCCCCCCC CCCCCCC CCCC</div>
        <div class="item">DDDDDDD DDD DDDDD</div>
        <div class="item">EEEEEEE EEEEEE EEEEEEEEEE</div>
        <div class="item">F</div>
    </div>
</body>
</html>
