<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .container {
            background-color: rgb(3, 3, 45);
            display: flex;
            flex-flow: row nowrap;
        }

        #a {
            flex-grow: 0;
            flex-shrink: 1;
            background-color: aqua;
            border: solid 2px black;
            text-align: center;
            flex-basis: 200px;
        }

         #b {
            flex-grow: 2;
            flex-shrink: 0;
            background-color: aqua;
            border: solid 2px black;
            text-align: center;
            flex-basis: 200px;
        }

         #c {
            flex-grow: 1;
            flex-shrink: 2;
            background-color: aqua;
            border: solid 2px black;
            text-align: center;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="a">A</div>
        <div id="b">B</div>
        <div id="c">C</div>
    </div>
</body>
</html>
