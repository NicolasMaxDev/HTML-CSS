<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout na prática</title>
</head>
<style>
    .container {
        border: 3px solid blue;
        height: 250px;
        display: grid;
        grid-template: repeat(3, 100px) / repeat(3, auto); 
        gap: 10px;
        place-items: normal normal; /* align items e justify items */
        place-content: normal normal; /* align content e justify content */  
    }

    .item {
        border: 3px solid red;
        background-color: rgba(134, 134, 205, 0.377);
        padding: 5px;
    }
</style>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
